<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Warm Aesthetic Accent Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Cute Heart Gradient -->
    <linearGradient id="heartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Cute Squircle Container -->
  <rect x="8" y="8" width="112" height="112" rx="36" fill="url(#bgGrad)" filter="url(#softShadow)" />

  <!-- Inner Soft Glow Ring -->
  <rect x="12" y="12" width="104" height="104" rx="32" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="2" />

  <!-- Cute Squad Piggy / Coin Buddy Face -->
  <!-- Cute Coin Body -->
  <circle cx="64" cy="66" r="38" fill="url(#coinGrad)" stroke="#FFFFFF" stroke-width="3.5" />

  <!-- Inner Coin Ring -->
  <circle cx="64" cy="66" r="31" fill="none" stroke="#FBBF24" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Cute Happy Eyes (Joyful Arcs) -->
  <path d="M 49 61 Q 53 54 57 61" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none" />
  <path d="M 71 61 Q 75 54 79 61" stroke="#78350F" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Cute Rosy Blushing Cheeks -->
  <ellipse cx="46" cy="68" rx="4.5" ry="3" fill="#FB7185" opacity="0.85" />
  <ellipse cx="82" cy="68" rx="4.5" ry="3" fill="#FB7185" opacity="0.85" />

  <!-- Cute Sweet Smile -->
  <path d="M 60 69 Q 64 74 68 69" stroke="#78350F" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Cute Mini Heart Floating on Cheek -->
  <path d="M 64 47 C 64 44 60 41 57 44 C 54 41 50 44 50 47 C 50 51 57 56 57 56 C 57 56 64 51 64 47 Z" fill="url(#heartGrad)" transform="translate(14, -4) scale(0.7)" />

  <!-- Sparkle Star Top Right ✨ -->
  <path d="M 94 24 Q 97 29 102 32 Q 97 35 94 40 Q 91 35 86 32 Q 91 29 94 24 Z" fill="#FFFFFF" opacity="0.95" />
  
  <!-- Tiny Sparkle Bottom Left ✨ -->
  <path d="M 28 88 Q 30 91 34 93 Q 30 95 28 98 Q 26 95 22 93 Q 26 91 28 88 Z" fill="#FDE047" opacity="0.9" />
</svg>
